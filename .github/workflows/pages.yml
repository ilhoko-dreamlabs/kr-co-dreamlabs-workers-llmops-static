name: Publish approved Pages commit

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact approved 40-character commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Require an immutable commit SHA
        id: commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        shell: bash
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "approved_commit must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          echo "commit=${APPROVED_COMMIT,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate-input.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: ""
      - name: Validate static artifact
        run: node scripts/validate.mjs
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
