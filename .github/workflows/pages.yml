name: Publish approved Pages commit

on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact approved 40-character commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-input:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Require an immutable commit SHA
        id: commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        shell: bash
        run: |
          if [[ ! "$APPROVED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "approved_commit must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          echo "commit=${APPROVED_COMMIT,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-input
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-input.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Validate static artifact
        run: node scripts/validate.mjs
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
